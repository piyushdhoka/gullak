# Builds the web app and deploys it to the EC2 instance on every push to main
# (the same steps as infra/deploy.ps1: Caddy serves dist/ and forwards /ingest to Supabase).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     the server's address
#   EC2_SSH_KEY  the full private key (.pem) for ec2-user
# Pushes that only touch the Supabase backend, docs or other non-web files skip the deploy.

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'infra/remote-setup.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-upload.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: gullak.sparkstudio.co.in

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (tests, types, lint)
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Build
        run: npm run build:web

      - name: Pack release
        run: tar -czf "$RUNNER_TEMP/gullak-release.tgz" -C apps/mobile dist

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_SSH_KEY" || { echo "Set the EC2_HOST and EC2_SSH_KEY repository secrets."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/gullak.pem
          chmod 600 ~/.ssh/gullak.pem
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "Could not reach the server on port 22."; exit 1; }

      - name: Upload and install
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          tr -d '\r' < infra/remote-setup.sh > "$RUNNER_TEMP/gullak-setup.sh"
          scp -i ~/.ssh/gullak.pem -o BatchMode=yes "$RUNNER_TEMP/gullak-release.tgz" "$RUNNER_TEMP/gullak-setup.sh" "ec2-user@$EC2_HOST:/tmp/"
          ssh -i ~/.ssh/gullak.pem -o BatchMode=yes "ec2-user@$EC2_HOST" "DOMAIN=$DOMAIN bash /tmp/gullak-setup.sh"

      - name: Check the live site
        run: |
          for path in / /features /sign-in; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN$path")
            echo "$path $code"
            test "$code" = 200
          done

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/gullak.pem
